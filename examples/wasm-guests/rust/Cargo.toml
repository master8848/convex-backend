[package]
name = "wasm_guest_example"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FSL-1.1-Apache-2.0"

# Standalone crate: intentionally excluded from the workspace because it
# targets wasm32-wasip1.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
convex_sdk = { path = "../../../crates/convex_sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
# Extra size wins: no debug, no incremental, single codegen unit already set.
debug = false
incremental = false

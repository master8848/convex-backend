[package]
name = "convex_sdk_macros"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FSL-1.1-Apache-2.0"
description = "Procedural macros for the convex_sdk Rust SDK"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = { workspace = true }
syn = { version = "2.0", features = ["full", "extra-traits"] }

[lints]
workspace = true

[package]
name = "wasm_runner"
version = "0.1.0"
edition = "2024"
license = "LicenseRef-FSL-1.1-Apache-2.0"

[features]
testing = [
    "common/testing",
    "database/testing",
    "errors/testing",
    "runtime/testing",
    "storage/testing",
    "value/testing",
]

[dependencies]
anyhow = { workspace = true }
common = { workspace = true }
database = { workspace = true }
futures = { workspace = true }
rand_chacha = "0.10.0"
rand_core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
value = { workspace = true }
wasmtime = { workspace = true }
wasmtime-wasi = { workspace = true }

[dev-dependencies]
common = { workspace = true, features = ["testing"] }
database = { workspace = true, features = ["testing"] }
errors = { workspace = true, features = ["testing"] }
runtime = { workspace = true, features = ["testing"] }
storage = { workspace = true, features = ["testing"] }
value = { workspace = true, features = ["testing"] }

[lints]
workspace = true
